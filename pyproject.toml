[project]
name = "django-at-stack"
# YYYY.M.PATCH — the same string must appear in package.json and package-lock.json.
# `make version-check` (also a pre-commit hook) fails the commit when they drift.
version = "2026.8.1"
description = "Django + Alpine.js + Tailwind CSS + DaisyUI — production-ready boilerplate"
requires-python = ">=3.12"

dependencies = [
    "Django>=6.0.7",
    "djangorestframework>=3.17.1",
    "django-environ>=0.14.0",
    # psycopg2 stays the default driver: it is what this stack is running in
    # production. Switching to `psycopg[binary]` (psycopg 3) works too — see
    # docs/deployment.md — but it is not what the lockfile has been tested with.
    "psycopg2-binary>=2.9.12",
    "Pillow>=12.3.0",
    "whitenoise>=6.9",
    "django-cors-headers>=4.9.0",
    "django-allauth>=65.18.0",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "django-redis>=7.0.0",
    "gunicorn>=26.0.0",
    "django-storages>=1.14.6",
    "boto3>=1.43.53",
]

[project.optional-dependencies]
prod = [
    "sentry-sdk>=2.66.0",
    # Optional: apps/core/metrics.py degrades to no-ops when it is absent,
    # so /metrics simply returns 404 instead of breaking the deployment.
    "prometheus-client>=0.25.0",
]

# PEP 735 dependency group — `uv sync` installs it by default, `uv sync --no-dev`
# (and the prod Docker stage) skips it. With the older `--extra dev` layout,
# forgetting the flag silently produced an environment without pytest.
[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "flake8-bugbear>=25.11.29",
    "pre-commit>=4.6.1",
    "django-debug-toolbar>=7.0.0",
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    # Used by scripts/demo_smoke.py only — browsers are installed on demand
    # with `uv run playwright install chromium`.
    "playwright>=1.61.0",
]

# The repo is an application, not a distributable package: without this uv looks
# for a build backend and fails on `uv sync`.
[tool.uv]
package = false

# ── Tool configs ───────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py312"]
# force-exclude, not just extend-exclude: pre-commit passes file paths
# explicitly, and black only applies extend-exclude to paths it discovered
# itself — migrations would be reformatted by the hook and left alone by
# `make beautify`, so the same files kept coming back dirty.
force-exclude = '''
/(
    migrations
  | \.venv
  | staticfiles
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_django = ["django"]
known_drf = ["rest_framework"]
known_first_party = ["apps", "config"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "DRF", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*", ".venv/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# Parallel by default. `--dist=loadscope` keeps every test of one module on the
# same worker, which is what the isolation rules in docs/testing.md assume.
addopts = [
    "-v",
    "--dist=loadscope",
    "--numprocesses=auto",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/management/commands/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
