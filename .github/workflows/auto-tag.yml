name: Auto Tag Version

# The tag comes from the version in pyproject.toml, so this only needs to run
# when that file changed. Triggering on every push to main means most runs do a
# full clone just to discover the tag already exists and exit.
#
# If a tag did not get created (a run failed on the network, say), press
# "Run workflow" on the branch.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag:
    name: Tag release commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The same script pre-commit and the CI job run. A hand-rolled comparison
      # here would drift from them, and drift in a version check is the one thing
      # that makes the check worthless.
      - name: Check version sync
        run: python scripts/check_version_sync.py

      - name: Read version
        id: version
        run: |
          PY_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "py_version=$PY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if missing
        env:
          VERSION: ${{ steps.version.outputs.py_version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
