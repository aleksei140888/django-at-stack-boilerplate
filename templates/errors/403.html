{% extends "base.html" %}
{% load i18n %}

{% block title %}403 — {% trans "Access denied" %} — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="relative flex min-h-[70vh] items-center justify-center overflow-hidden px-6">
  <div class="tribal-grid pointer-events-none absolute inset-0 opacity-40" aria-hidden="true"></div>
  <div class="animate-enter relative max-w-md text-center">
    <p class="text-9xl font-black text-warning/20 select-none leading-none">403</p>
    <h1 class="mt-4 mb-4 text-2xl">{% trans "Access denied" %}</h1>
    <p class="prose-tribal mx-auto mb-8">{% trans "You don't have permission to access this page." %}</p>
    <a href="{% url 'pages:home' %}" class="btn-tribal">{% trans "Go to homepage" %}</a>
  </div>
</div>
{% endblock %}
