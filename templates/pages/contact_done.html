{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Message sent" %} — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center px-6">
  <div class="animate-enter flex max-w-md flex-col items-center text-center">
    <span class="mb-6 grid h-14 w-14 place-items-center rounded-lg border border-success/40 bg-success/10 text-success"
          aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>
      </svg>
    </span>
    <h1 class="mb-4 text-2xl">{% trans "Message sent!" %}</h1>
    <p class="prose-tribal mb-8">{% trans "Thank you for reaching out. We'll get back to you as soon as possible." %}</p>
    <a href="{% url 'pages:home' %}" class="btn-tribal">{% trans "Back to home" %}</a>
  </div>
</div>
{% endblock %}
