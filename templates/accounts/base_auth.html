{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="relative flex min-h-[70vh] items-center justify-center overflow-hidden px-6 py-16">
  <div class="tribal-grid pointer-events-none absolute inset-0 opacity-50" aria-hidden="true"></div>

  <div class="animate-enter relative w-full max-w-md">
    <div class="card-tribal glow-primary p-6 backdrop-blur-sm sm:p-8">
      <h1 class="mb-6 text-center text-2xl">{% block auth_title %}{% endblock %}</h1>
      {% block auth_content %}{% endblock %}
    </div>
    {% block auth_footer %}{% endblock %}
  </div>
</div>
{% endblock %}
