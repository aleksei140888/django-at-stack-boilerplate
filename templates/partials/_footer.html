{% load i18n %}
<footer class="border-t border-primary/15 bg-base-200/60" role="contentinfo">
  <div class="neon-rule" aria-hidden="true"></div>
  <div class="mx-auto flex w-full max-w-[1280px] flex-col gap-6 px-6 py-10 sm:flex-row sm:items-center sm:justify-between">
    {# flex-wrap, not a single non-wrapping row: five links are wider than a 360px viewport #}
    <nav class="flex flex-wrap gap-x-5 gap-y-2 text-sm" aria-label="{% trans 'Footer navigation' %}">
      <a href="{% url 'pages:home' %}" class="text-base-content/60 transition-colors duration-200 hover:text-primary">{% trans "Home" %}</a>
      <a href="{% url 'pages:contact' %}" class="text-base-content/60 transition-colors duration-200 hover:text-primary">{% trans "Contact" %}</a>
      <a href="{% url 'pages:privacy' %}" class="text-base-content/60 transition-colors duration-200 hover:text-primary">{% trans "Privacy Policy" %}</a>
      <a href="{% url 'pages:terms' %}" class="text-base-content/60 transition-colors duration-200 hover:text-primary">{% trans "Terms" %}</a>
      <a href="{% url 'pages:cookies' %}" class="text-base-content/60 transition-colors duration-200 hover:text-primary">{% trans "Cookies" %}</a>
    </nav>
    <p class="font-mono text-xs text-base-content/40">
      © {% now "Y" %} {{ SITE_NAME }} · v{{ APP_VERSION }}
    </p>
  </div>
</footer>
