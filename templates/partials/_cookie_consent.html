{% load i18n %}
<div
  x-data="cookieConsent()"
  x-cloak
  x-show="!accepted"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-4"
  x-transition:enter-end="opacity-100 translate-y-0"
  class="fixed inset-x-0 bottom-0 z-overlay border-t border-primary/20 bg-base-200/95 p-4 backdrop-blur-md"
  role="dialog"
  aria-label="{% trans 'Cookie consent' %}"
  aria-modal="false"
>
  <div class="mx-auto flex w-full max-w-[1280px] flex-col items-start gap-4 px-2 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-base-content/70">
      {% blocktrans trimmed %}
        We use cookies to keep you signed in and to understand how the site is used.
        See the <a href="/cookies/" class="text-primary underline">Cookie Policy</a> and
        <a href="/privacy/" class="text-primary underline">Privacy Policy</a>.
      {% endblocktrans %}
    </p>
    <div class="flex w-full shrink-0 gap-2 sm:w-auto">
      <button @click="accept()"
              class="btn-tribal flex-1 px-4 py-2 text-sm sm:flex-none">
        {% trans "Accept" %}
      </button>
      <a href="{% url 'pages:cookies' %}"
         class="btn-tribal-ghost flex-1 px-4 py-2 text-sm sm:flex-none">
        {% trans "Learn more" %}
      </a>
    </div>
  </div>
</div>
